<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">customer-journey-lifecycle</title>
<desc id="d">Three panels from the repo's fictional subscription example. 1, current state: New subscriber who has created an account but has not completed the core value action; desired transition: Account created to first meaningful value achieved. 2, the suppressions, when not to send: core action completed, active service issue requiring a different owner, channel permission unavailable, recent equivalent contact, explicit rejection. 3, measurement: Use a customer-level control or holdout where feasible. Measure incremental completion of the core action and monitor opt-out, support contacts, and early cancellation.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,30.6%{opacity:0}32.2%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,48.3%{opacity:0}50%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,51.7%{opacity:0}53.4%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,55.1%{opacity:0}56.8%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,58.5%{opacity:0}60.2%,100%{opacity:1}}
@keyframes rg{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,81.4%{opacity:0}83.1%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">customer-journey-lifecycle</text>
<text x="380" y="50" class="sans" font-size="13.5" fill="#a9adb2">A portable Agent Skill for customer-state modeling, lifecycle journey design</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · A NEW SUBSCRIBER</text>
<rect x="32" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="242" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">fictional-subscription-example.md</text>
<line x1="33" y1="123" x2="273" y2="123" stroke="#2e3237"/>
<g class="r1"><text x="44" y="142" class="mono" font-size="10" fill="#8b9096">Current state</text><text x="44" y="158" class="sans" font-size="10.5" fill="#e4dfd4">New subscriber who has created an</text><text x="44" y="172" class="sans" font-size="10.5" fill="#e4dfd4">account but has not completed the</text><text x="44" y="186" class="sans" font-size="10.5" fill="#e4dfd4">core value action.</text></g>
<g class="r2"><text x="44" y="209" class="mono" font-size="10" fill="#8b9096">Desired transition</text><text x="44" y="225" class="sans" font-size="10.5" fill="#e4dfd4">Account created →</text><text x="44" y="239" class="sans" font-size="10.5" fill="#e4dfd4">first meaningful value achieved.</text></g>
<text x="32" y="272" class="sans cap">Signed up, no first value yet.</text>
</g>

<g>
<text x="294" y="88" class="sans lab" fill="#c8963e">2 · WHEN NOT TO SEND</text>
<rect x="294" y="98" width="312" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h2" x="294" y="98" width="312" height="152" rx="3" stroke="#c8963e"/>
<text x="306" y="115" class="mono" font-size="10" fill="#8b9096">examples/fictional-subscription-example.md</text>
<line x1="295" y1="123" x2="605" y2="123" stroke="#2e3237"/>
<text x="306" y="142" class="mono" font-size="10" fill="#8b9096">Suppressions</text>
<g class="rb"><circle cx="310" cy="159.5" r="1.8" fill="#c8963e"/><text x="318" y="163" class="sans" font-size="10.5" fill="#e4dfd4">core action completed</text></g>
<g class="rc"><circle cx="310" cy="177.5" r="1.8" fill="#c8963e"/><text x="318" y="181" class="sans" font-size="10.5" fill="#e4dfd4">active service issue requiring a different owner</text></g>
<g class="rd"><circle cx="310" cy="195.5" r="1.8" fill="#c8963e"/><text x="318" y="199" class="sans" font-size="10.5" fill="#e4dfd4">channel permission unavailable</text></g>
<g class="re"><circle cx="310" cy="213.5" r="1.8" fill="#c8963e"/><text x="318" y="217" class="sans" font-size="10.5" fill="#e4dfd4">recent equivalent contact</text></g>
<g class="rf"><circle cx="310" cy="231.5" r="1.8" fill="#c8963e"/><text x="318" y="235" class="sans" font-size="10.5" fill="#e4dfd4">explicit rejection</text></g>
<text x="294" y="272" class="sans cap">Five reasons to send nothing.</text>
</g>

<g>
<text x="626" y="88" class="sans lab" fill="#93ad8c">3 · A HOLDOUT TEST</text>
<rect x="626" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="626" y="98" width="242" height="152" rx="3" stroke="#93ad8c"/>
<text x="638" y="115" class="mono" font-size="10" fill="#8b9096">fictional-subscription-example.md</text>
<line x1="627" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<text x="638" y="142" class="mono" font-size="10" fill="#8b9096">Measurement</text>
<g class="rg"><text x="638" y="160" class="sans" font-size="10.5" fill="#e4dfd4">Use a customer-level control or</text><text x="638" y="175" class="sans" font-size="10.5" fill="#e4dfd4">holdout where feasible. Measure</text><text x="638" y="190" class="sans" font-size="10.5" fill="#e4dfd4">incremental completion of the core</text><text x="638" y="205" class="sans" font-size="10.5" fill="#e4dfd4">action and monitor opt-out, support</text><text x="638" y="220" class="sans" font-size="10.5" fill="#e4dfd4">contacts, and early cancellation.</text></g>
<rect class="rh" x="633" y="179" width="180" height="32" fill="none" stroke="#93ad8c" stroke-dasharray="3 2"/>
<text x="626" y="272" class="sans" font-size="11.5" fill="#93ad8c">Measured against a control or holdout.</text>
</g>
</svg>
