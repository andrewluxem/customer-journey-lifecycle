name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_skill.py
      - run: python scripts/check_public_claims.py
      - run: python scripts/run_evals.py
      - run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: customer-journey-lifecycle-skill
          path: dist/*.skill
