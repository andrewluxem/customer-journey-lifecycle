name: Feature request
description: Propose an improvement to the skill, references, templates, or portability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What lifecycle task or failure mode is not handled well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Public-safety considerations
      description: Confirm the proposal contains no restricted or identifying material.
    validations:
      required: true
