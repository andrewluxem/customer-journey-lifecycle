name: Skill behavior bug
description: Report incorrect activation, missing logic, or weak output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: prompt
    attributes:
      label: Prompt or task
      description: Use a public or fictional example only.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
